[package]
name = "autograv"
version = "0.1.0"
edition = "2024"
authors = ["Baalateja Kataru <baalateja.k@gmail.com>"]
description = "Tensor calculus engine for numerical relativity (Christoffel, Riemann, Einstein, ...) built on diffable's typed automatic differentiation"
readme = "README.rust.md"
license = "MIT"
repository = "https://github.com/planckeon/autograv"
documentation = "https://docs.rs/autograv"
keywords = ["general-relativity", "numerical-relativity", "automatic-differentiation", "tensor-calculus", "differential-geometry"]
categories = ["science", "mathematics"]
include = [
    "Cargo.toml",
    "LICENSE",
    "/README.rust.md",
    "src/**/*.rs",
    "tests/**/*.rs",
    "examples/**/*.rs",
]

[lib]
name = "autograv"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true

[dependencies]
diffable = { version = "0.5.0", default-features = false, features = ["std"] }
num-traits = "0.2"
